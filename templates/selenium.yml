# Selenium grid (hub + browser nodes), standalone browsers and the side runner.
# The standalone browsers are alternatives of the grid nodes (same VNC ports).

selenium-hub:
  image: selenium/hub
  container_name: selenium-hub
  networks:
    app-tier:
      aliases:
        - selenium-hub
  ports:
    - "24442:4442"
    - "24443:4443"
    - "24444:4444"

chrome:
  image: selenium/node-chrome
  container_name: chrome
  shm_size: 2gb
  networks:
    app-tier:
      aliases:
        - chrome
  depends_on:
    - selenium-hub
  environment:
    - SE_EVENT_BUS_HOST=selenium-hub
    - SE_EVENT_BUS_PUBLISH_PORT=4442
    - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
  ports:
    - "7900:7900"

edge:
  image: selenium/node-edge
  container_name: edge
  shm_size: 2gb
  networks:
    app-tier:
      aliases:
        - edge
  depends_on:
    - selenium-hub
  environment:
    - SE_EVENT_BUS_HOST=selenium-hub
    - SE_EVENT_BUS_PUBLISH_PORT=4442
    - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
  ports:
    - "7901:7900"

firefox:
  image: selenium/node-firefox
  container_name: firefox
  shm_size: 2gb
  networks:
    app-tier:
      aliases:
        - firefox
  depends_on:
    - selenium-hub
  environment:
    - SE_EVENT_BUS_HOST=selenium-hub
    - SE_EVENT_BUS_PUBLISH_PORT=4442
    - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
  ports:
    - "7902:7900"

chrome-standalone:
  container_name: chrome-standalone
  image: selenium/standalone-chrome
  shm_size: 2gb
  networks:
    app-tier:
      aliases:
        - chrome-standalone
  ports:
    - "14440:4444"
    - "7900:7900"

edge-standalone:
  image: selenium/standalone-edge
  shm_size: 2gb
  networks:
    app-tier:
      aliases:
        - edge-standalone
  container_name: edge-standalone
  ports:
    - "14441:4444"
    - "7901:7900"

firefox-standalone:
  image: selenium/standalone-firefox
  shm_size: 2gb
  container_name: firefox-standalone
  networks:
    app-tier:
      aliases:
        - firefox-standalone
  ports:
    - "14442:4444"
    - "7902:7900"

selenium-side-runner:
  container_name: selenium-side-runner
  build:
    context: docker/selenium-side-runner
    args:
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
  networks:
    app-tier:
      aliases:
        - selenium-side-runner
  x-binds:
    - vhosts:/var/www/vhosts
  user: $USER_ID:$GROUP_ID
  tty: true
  extra_hosts:
    - host.docker.internal:host-gateway
