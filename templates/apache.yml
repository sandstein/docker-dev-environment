apache-24:
  container_name: apache-24
  build:
    context: docker/apache-24
    args:
      USER_ID: ${USER_ID}
      GROUP_ID: ${GROUP_ID}
  networks:
    app-tier:
      aliases:
        - apache-24
        - m2.localhost
  ports:
    - "${APACHE_24_IP}:${APACHE_24_HTTP_PORT}:80"
    - "${APACHE_24_IP}:${APACHE_24_HTTPS_PORT}:443"
  x-binds:
    - config/apache-24/conf.d:/usr/local/apache2/conf/conf.d
    - vhosts:/var/www/vhosts
