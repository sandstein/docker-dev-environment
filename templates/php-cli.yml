{{name}}:
  container_name: {{name}}
  environment:
    - SSH_AUTH_SOCK=$SSH_AUTH_SOCK
  build:
    context: docker/php-cli
    args:
      USER_ID: ${USER_ID}
      GROUP_ID: ${GROUP_ID}
  networks:
    app-tier:
      aliases:
        - {{name}}
  x-binds:
    - vhosts:/var/www/vhosts
    - config/{{name}}/etc/php:/usr/local/etc/php
    - $SSH_AUTH_SOCK_BASE:$SSH_AUTH_SOCK_BASE
    - $CONFIG_BASE:/home/phpcli/.config
    - $SSH_BASE:/home/phpcli/.ssh
    - config/{{name}}/composer:/home/phpcli/.composer
    - config/{{name}}/bin:/home/phpcli/bin
  user: $USER_ID:$GROUP_ID
  tty: true
  extra_hosts:
    - host.docker.internal:host-gateway
