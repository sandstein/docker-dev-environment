{{name}}:
  container_name: {{name}}
  build:
    context: docker/opensearch
    args:
      USER_ID: ${USER_ID}
      GROUP_ID: ${GROUP_ID}
  networks:
    app-tier:
      aliases:
        - {{name}}
  env_file: {{env_file}}
  ports:
    - "{{port}}:9200"
    - "{{transport_port}}:9300"
  x-binds:
    - data/{{name}}:/usr/share/opensearch/data
    - config/{{name}}/config:/usr/share/opensearch/config
