# CI for git.sandstein.de. Each job runs directly in the pinned tool image
# (the same images the Makefile uses), so no docker-in-docker is needed.

stages:
  - check

default:
  interruptible: true

generated:
  stage: check
  image:
    name: dannyben/bashly:1.4.0
    entrypoint: [""]
  before_script:
    - apk add --no-cache git
  script:
    - cd bin && bashly generate && bashly add completions_script --force && cd ..
    - git diff --exit-code -- bin/dde bin/completions.bash

shellcheck:
  stage: check
  image:
    name: koalaman/shellcheck-alpine:v0.10.0
    entrypoint: [""]
  script:
    - shellcheck -S warning bin/dde tests/bin/docker

hadolint:
  stage: check
  image:
    name: hadolint/hadolint:v2.12.0-alpine
    entrypoint: [""]
  script:
    - hadolint docker/*/Dockerfile

compose:
  stage: check
  image: docker:27-cli
  before_script:
    - apk add --no-cache python3 py3-yaml
  script:
    - python3 tools/check-compose.py

bats:
  stage: check
  image:
    name: bats/bats:1.11.1
    entrypoint: [""]
  script:
    - bats tests
