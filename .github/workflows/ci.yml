name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: make check (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: pip install pyyaml
      - name: make check
        run: make check

  macos:
    # No docker on macOS runners: this job only runs the CLI tests (docker is
    # faked anyway) to catch bash/BSD userland differences.
    name: bats (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bash and bats
        run: brew install bash bats-core
      - name: bats
        run: make test BATS=bats
