name: dde
help: Docker dev environment - versioned service containers for local development
version: 1.0.0

commands:

- name: up
  alias: start
  help: Create and start containers (default - DOCKER_CONTAINER from .env.dde)
  args:
  - name: service
    repeatable: true
    help: Services to start, space or comma separated
  flags:
  - long: --build
    help: Build images before starting containers
  - long: --force-recreate
    help: Recreate containers even if their configuration and image haven't changed
  examples:
  - dde up
  - dde up redis-7 mailpit
  - dde up --force-recreate apache-24

- name: stop
  help: Stop containers without removing them (default - DOCKER_CONTAINER from .env.dde)
  args:
  - name: service
    repeatable: true
    help: Services to stop, space or comma separated
  flags:
  - long: --all
    short: -a
    help: Stop every running dde container, not only the ones of this project

- name: down
  help: Stop and remove containers (default - DOCKER_CONTAINER from .env.dde). Never removes data.
  args:
  - name: service
    repeatable: true
    help: Services to remove, space or comma separated
  flags:
  - long: --all
    short: -a
    help: Remove every dde container and the dde network, not only the ones of this project

- name: restart
  help: Restart containers (default - DOCKER_CONTAINER from .env.dde)
  args:
  - name: service
    repeatable: true
    help: Services to restart, space or comma separated

- name: build
  help: Build or rebuild images (default - DOCKER_CONTAINER from .env.dde)
  args:
  - name: service
    repeatable: true
    help: Services to build, space or comma separated
  flags:
  - long: --all
    short: -a
    help: Build every dde service. This takes a while.
  - long: --no-cache
    help: Do not use cache when building the image
  - long: --pull
    help: Always attempt to pull newer versions of the base images
  examples:
  - dde build --pull --no-cache php-cli-83

- name: exec
  help: |-
    Execute a command in a running container

    Options (docker style, must come before COMMAND):
      -s, --service SERVICE  Service (default: DEFAULT_CONTAINER)
      -u, --user USER        User name or uid (default: USER_ID, e.g. root)
      -w, --workdir DIR      Working directory in the container (default:
                             current dir below /var/www/vhosts, if mounted)
      -e, --env KEY=VALUE    Set an environment variable
      -T, --no-tty           No pseudo-TTY (automatic if stdin is no tty)
  catch_all:
    label: command
    help: The command and its arguments, passed on unchanged
    required: true
  examples:
  - dde exec bin/magento cache:clean
  - dde exec -s mysql-80 mysql -u root -e 'SELECT 1'
  - dde exec -u root -s php-cli-83 apt-get update
  - cat script.php | dde exec php /dev/stdin

- name: run
  help: |-
    Run a one-off command in a new container (docker compose run --rm)

    Options are the same as for dde exec (-s, -u, -w, -e, -T).
  catch_all:
    label: command
    help: The command and its arguments, passed on unchanged
    required: true
  examples:
  - dde run -s php-cli-83 php -v

- name: shell
  help: Open an interactive shell (bash, or sh if bash is missing) in a running container
  flags:
  - long: --service
    short: -s
    arg: service
    help: Service to open the shell in (default - DEFAULT_CONTAINER from .env.dde)
  - long: --user
    short: -u
    arg: user
    help: User name or uid (default - USER_ID from the dde .env)
  - long: --workdir
    short: -w
    arg: dir
    help: Working directory inside the container
  examples:
  - dde shell
  - dde shell -s mysql-80 -u root

- name: logs
  help: Show container output (default - DOCKER_CONTAINER from .env.dde)
  args:
  - name: service
    repeatable: true
    help: Services to show, space or comma separated
  flags:
  - long: --follow
    short: -f
    help: Follow log output
  - long: --tail
    short: -n
    arg: lines
    help: Number of lines to show from the end of the logs

- name: ps
  help: List the containers of this project and their state (same as dde get containers)
  flags:
  - &all_containers
    long: --all
    short: -a
    help: Show every existing dde container, not only the ones of this project

- name: ls
  help: List all services dde can start (same as dde get services)
  args:
  - &filter
    name: filter
    help: Only show services containing this text, e.g. php
  examples:
  - dde ls php-cli

- name: get
  help: Display resources
  commands:
  - name: services
    help: List all services dde can start
    args:
    - *filter
  - name: containers
    help: List the containers of this project and their state
    flags:
    - *all_containers

- name: compose
  help: Run any docker compose command against the dde compose file
  catch_all:
    label: arguments
    help: Arguments for docker compose
    required: true
  examples:
  - dde compose top php-cli-83
  - dde compose config php-cli-83

- name: config
  help: Show the resolved settings for the current directory

- name: list
  help: List the dde commands

- name: version
  help: Show version information
  flags:
  - long: --short
    help: Only print the version number

- name: init
  help: Hook dde into your shell (PATH and completions). Run once after cloning.
